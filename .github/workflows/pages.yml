name: Publish Setup Page

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'web/src/setup*'
      - 'web/package*.json'
      - 'scripts/install_unoq.sh'
      - 'docs/images/studio-gripper.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy public installer and launcher
        id: deployment
        uses: actions/deploy-pages@v4