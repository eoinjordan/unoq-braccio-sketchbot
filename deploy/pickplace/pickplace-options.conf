# Options for sketchbot-pickplace.service. One line, shell-style words.
#
#   --bind 0.0.0.0     serve the page to the local network, not only to the
#                      board's own screen. Anyone who can open it can press
#                      Start. Trusted networks only.
#   --live --i-have-calibrated-this-arm
#                      sessions move the arm. Leave out until every step of
#                      docs/pick-place.md "Calibration" is done on this arm.
#   --autostart        start one session by itself the first time the arm
#                      agent and the camera are both there after the service
#                      starts. Off by default: an arm that moves at power-on
#                      with nobody ready is a hazard.
#   --full-speed       drop the slow profile.
#   --port /dev/ttyACM0   name the camera port instead of finding vendor 303A.
PICKPLACE_ARGS=--bind 0.0.0.0
