<?xml version="1.0" encoding="UTF-8"?>
<!--
  Edge Impulse Sketchbot paper template.
  Print at 100% scale and tape inside the arm's paper box. The 150 x 150 mm
  drawing area matches config/workspace.yaml (paper.width_mm / height_mm) and
  config/branding.yaml (postcard.drawing_box). Adjust if you change those.
  Drop the official logo/QR in later; text branding is used here so nothing
  trademarked is embedded.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="230mm"
     viewBox="0 0 180 230">
  <rect x="0" y="0" width="180" height="230" fill="#ffffff"/>

  <!-- Header band -->
  <rect x="0" y="0" width="180" height="30" fill="#3b47ce"/>
  <text x="12" y="15" fill="#ffffff" font-family="Helvetica, Arial, sans-serif"
        font-size="9" font-weight="bold">Edge Impulse</text>
  <text x="12" y="24" fill="#00e5a0" font-family="Helvetica, Arial, sans-serif"
        font-size="9" font-weight="bold">Sketchbot</text>
  <text x="168" y="18" fill="#ffffff" text-anchor="end"
        font-family="Helvetica, Arial, sans-serif" font-size="5">
    Drawn live by an Arduino UNO Q + Braccio
  </text>

  <!-- 150 x 150 mm drawing area, centred horizontally, top at y=45 -->
  <rect x="15" y="45" width="150" height="150" fill="none"
        stroke="#dfe3ec" stroke-width="0.4" stroke-dasharray="2 2"/>
  <!-- Corner registration ticks for the gripper-camera homography -->
  <g stroke="#3b47ce" stroke-width="0.8">
    <path d="M15 51 L15 45 L21 45"/>
    <path d="M159 45 L165 45 L165 51"/>
    <path d="M165 189 L165 195 L159 195"/>
    <path d="M21 195 L15 195 L15 189"/>
  </g>

  <!-- Footer CTA -->
  <text x="12" y="212" fill="#0b1221" font-family="Helvetica, Arial, sans-serif"
        font-size="6">Build your own at edgeimpulse.com</text>
  <rect x="150" y="200" width="18" height="18" fill="none"
        stroke="#0b1221" stroke-width="0.4"/>
  <text x="159" y="211" fill="#8a93a6" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="3">QR</text>
</svg>
