# Portrait -> line-art -> strokes tuning.

capture:
  target_px: 512           # working square canvas the pipeline operates on

portrait:
  detect_face: true        # crop to the largest detected face
  segment_person: true     # GrabCut the head+hair+shoulders so the hair/face
                           # outline is drawn and a busy background is removed
                           # (best for real photos). Falls back to plain edges
                           # when no face is found or segmentation fails.
  crop_margin: 0.14        # padding around the face box (fraction of box size);
                           # lower = less background traced around the face
  # Haar cascade shipped with OpenCV; leave blank to auto-locate.
  face_cascade: ""
  # Detection sensitivity. Lower min_size_px / min_neighbors detect smaller or
  # further-away faces (at the cost of more false positives). If the pipeline
  # keeps tracing the whole room, lower min_size_px first.
  scale_factor: 1.1        # Haar pyramid step (closer to 1.0 = more thorough)
  min_neighbors: 4         # higher = fewer false positives, stricter
  min_size_px: 60          # smallest detectable face (pixels)

caricature:
  enabled: true            # false = straight 1:1 sketch
  strength: 0.35           # 0 = off; ~0.3 gentle, ~0.6 strong big-head look
  center_x: 0.5            # warp centre as a fraction of the crop (0..1)
  center_y: 0.42           # slightly high so the eyes/nose are enlarged most

edges:
  method: dog              # "dog" (difference of gaussians, softer portrait
                           # lines) or "canny" (crisper, more background edges)
  bilateral_d: 9           # edge-preserving smoothing before edges
  bilateral_sigma: 110     # higher = flatter skin/wall texture
  bilateral_passes: 1      # repeat the smoothing; the main texture-noise killer
  canny_low: 90            # only used when method == "canny"
  canny_high: 200
  dog_sigma1: 1.0          # only used when method == "dog"
  dog_sigma2: 2.6
  dog_threshold: 0         # 0 = Otsu auto-threshold; keeps real-photo face detail
  despeckle_px: 3          # morphological open kernel to remove noise dots (0 = off)

# Neural line art (preferred when the model file is present).
#
# A small Informative Drawings generator run on the CPU via onnxruntime. The
# Canny/DoG tracers below find the hair outline and glasses but miss the eyes,
# nose and mouth; this model was trained to draw them. ~17 MB, ~1 s a frame, no
# GPU. Fetch it with scripts/fetch_lineart_model.sh; with no model on disk (or
# no onnxruntime) the pipeline silently falls back to the classic path.
neural_lineart:
  enabled: true
  model_path: models/lineart_informative.onnx
  input_px: 512            # square the model runs at
  threshold: 0.65          # ink where model output < this (higher = more ink)
  thin: true               # skeletonise to 1 px so the pen draws each line once
  segment_person: true     # GrabCut away the background before tracing
  erode_mask_px: 19        # shrink the person mask before masking ink, so
                           # the background fringe around the hair is cut
  draw_outline: false      # the model already draws the hair edge; the
                           # GrabCut silhouette on top of it is just jagged
  min_blob_px: 12          # drop specks smaller than this

vectorize:
  min_contour_len_px: 14   # drop specks shorter than this
  simplify_epsilon_px: 1.0 # Douglas-Peucker tolerance (higher = fewer points)
  max_strokes: 240         # hard cap on lines drawn (lower = faster, sparser)
  max_points_per_stroke: 120

style:
  # Optional caricature emphasis: thicken/keep only the strongest edges.
  keep_longest_fraction: 0.85  # 1.0 = keep all; <1 keeps only longest strokes

# Person segmentation for the caricature (portrait.segment_person). The crop is
# expanded around the detected face to include hair (above) and beard/shoulders
# (below); GrabCut then separates the person from the background.
segment:
  margin_top: 1.15         # expand crop above the face box (x face height) for hair
  margin_sides: 0.55       # expand crop left/right (x face width)
  margin_bottom: 0.95      # expand crop below (x face height) for beard/shoulders
  mask_open_px: 25         # sever background lumps welded to the subject
  grabcut_iters: 5         # GrabCut refinement iterations
  outline_simplify_px: 2.5 # Douglas-Peucker tolerance for the head/hair outline
  interior_canny_low: 40   # interior feature edges (glasses, eyes, beard)
  interior_canny_high: 120
