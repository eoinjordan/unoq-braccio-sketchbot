# Cameras are resolved by USB vendor:product ID so the roles stay stable even
# when /dev/videoN numbering changes across reboots. Find IDs with `lsusb`, or
# run `python -m sketch_artist.cameras` to list nodes and their VID:PID.
#
# ONE-CAMERA RIG (recommended): a single wrist-mounted USB camera does both
# jobs. The arm points it at the visitor to capture the portrait, then at the
# paper to calibrate (see `camera_poses` in workspace.yaml). Both the `face` and
# `gripper` roles fall back to this shared `single` camera.
cameras:
  single:
    description: "Wrist-mounted USB camera (UNO Q USB-C OTG -> USB-A webcam)"
    usb_id: "0000:0000"      # <-- set to YOUR camera's VID:PID (see above)
    width: 1280
    height: 720
    warmup_frames: 8         # frames to discard so exposure/white-balance settle

# TWO-CAMERA RIG (alternative): a fixed person-facing camera plus a gripper
# camera. Remove the `single:` entry above and uncomment these to give each role
# a dedicated device.
#  face:
#    description: "Person-facing camera used to capture the portrait"
#    usb_id: "1532:0e03"     # Razer USA, Ltd Gaming Webcam [Kiyo]
#    width: 1280
#    height: 720
#    warmup_frames: 8
#  gripper:
#    description: "Gripper-mounted camera viewing the paper while drawing"
#    usb_id: "060b:8038"     # Solid Year SW72011
#    width: 640
#    height: 480
#    warmup_frames: 4

# ESP-EYE CAMERA (no USB webcam needed): flash firmware/esp_eye_camera and point
# the `single` camera at it. Use ONE transport instead of `usb_id`:
#
#   Wi-Fi (both on the same network):
#  single:
#    description: "ESP-EYE over Wi-Fi"
#    url: "http://esp-eye.local/capture"   # or http://<esp-eye-ip>/capture
#    width: 800
#    height: 600
#
#   USB (ESP-EYE micro-USB -> UNO Q USB-C):
#  single:
#    description: "ESP-EYE over USB"
#    serial: "auto"        # or a fixed node like /dev/ttyUSB0
#    baud: 921600
#    warmup_frames: 2
