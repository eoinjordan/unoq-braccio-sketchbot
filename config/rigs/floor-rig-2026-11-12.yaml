# Pick-and-place values for the floor rig (LEGO bricks, short printed
# fingers, XIAO round-display holder on top of the gripper), as it stood at
# the end of 2026-11-12. Copy the pick_place block into config/runtime.yaml
# on the board to use it with sketch_artist.pick_place_service.
#
# Status: no brick has been picked on this rig. The service runs these
# values in dry-run only. Do not add --live to the service options until a
# single pick has been made by hand with sketch_artist.pickplace_overhead.live
# and watched. See docs/pick-place-service.md.
#
# Sources: "studio" = the owner's grabber bench settings in the Studio's
# config/runtime.yaml (tool 100 mm, pitch -55, jaws 10 open and 65 closed,
# base height 92); "run" = what the hand-driven run on 2026-11-12 used and
# saw; "assumed" = not measured.
pick_place:
  arm:
    # run: the bricks and the bin lie on the side the folded gripper points
    # to, so the arm leans over its shoulder.
    reach_behind: true
    wrist_zero_deg: 90.0           # studio servo calibration
  tool:
    # studio: 100 mm from the wrist pitch axis to the grasp point.
    mount_from_wrist_mm: 45.0
    grasp_from_mount_mm: 55.0
    tip_from_mount_mm: 60.0        # assumed
    wrist_rotation_deg: 90.0       # run: camera on top at roll 90
  gripper:
    # studio: open 10, closed 65. Gap at servo 10 about 45 mm (run, read off
    # the overhead camera); the closed end is assumed.
    jaw_calibration:
      - {deg: 10.0, width_mm: 45.0}
      - {deg: 65.0, width_mm: 3.0}
    open_width_mm: 44.0
  bin:
    rim_height_mm: 110.0           # assumed
    release_clearance_mm: 20.0
    # run: the bin is dropped into at a fixed pose. Estimated from the
    # overhead camera on 2026-11-12 (base servo about 56, about 231 mm out,
    # behind the base); not checked by a drop. The gripper camera's bin
    # detection is not used: it reported the charging USB lead's glow as
    # the bin.
    fallback_xy_mm: [191.5, -129.2]
  search:
    # run: the base turned 10 to 149 without trouble, but at 149 the camera
    # holder passed within a few centimetres of a chair leg. Keep the sweep
    # inside what is clear on the day.
    base_min_deg: 30.0
    base_max_deg: 140.0
  # Hand-driven numbers from the run (base servo, reach and height in the
  # Studio model, mm), kept here as a record, not read by the code:
  #   base axis on the floor in the overhead picture: about (815, 450) px;
  #   picture angle turns about 1.0 degree per base servo degree once the
  #   base was fixed (it was 0.5 to 0.75 while the base slid);
  #   base 107, reach 200, height 90: claws seen about 230 px from the axis,
  #     so roughly 1.15 px per model mm at that reach;
  #   descent at base 149, reach 204: 90, 70, 55, 45, 35, 25, 15, 8 mm with
  #     jaws at 10, then closed 35, 50, 65 and lifted. The claws came down on
  #     the near side of the 2x2 brick, not around it, and pushed it about
  #     8 mm outward. Nothing was gripped.
