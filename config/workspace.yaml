# Physical geometry of the arm and the drawing surface.
# ALL distances in millimetres, angles in degrees.
#
# Measure YOUR arm and paper placement and update these values. The defaults
# are nominal TinkerKit Braccio dimensions and a paper placed in front of the
# base; they will not be accurate until calibrated (see docs/calibration.md).

links:
  # Height from the table to the shoulder rotation axis: the 10 mm base plate
  # plus 72 mm up to the shoulder servo. Matches the Gazebo model, so the same
  # commands draw the same picture in sim and on the bench.
  base_height_mm: 82
  # Shoulder axis -> elbow axis.
  shoulder_mm: 125
  # Elbow axis -> wrist axis.
  elbow_mm: 125
  # Wrist axis -> pencil tip, with the printed grip (hardware/pencil-grip)
  # mounted and the pencil protruding ~25-40 mm. Tune to your build.
  #   90 mm  wrist_vertical axis -> finger mounting face (from the URDF:
  #          60 mm to wrist_rotation + 30 mm to the finger)
  # + 57 mm  mounting face -> bottom of the printed collar
  # + 27 mm  pencil proud of the collar
  # The grip's OpenSCAD source echoes this number when you render it.
  # MEASURED on this rig with web/calibrate (ladder from +2 to -12 mm: only the
  # lowest dashes inked, contact at ~-11 mm from the 174 design length). This
  # ballpoint sits ~11 mm shorter in the collar than the design intends.
  wrist_pen_mm: 163
  # Degrees the TOP of the pencil leans toward the base (0 = vertical). This
  # is not a style choice. Measured on this rig (ESP-EYE, wrist sweep with all
  # other joints held): with the printed grip fitted the wrist_vertical servo
  # does not move at all below ~14 deg - the finger pivot sits on the wrist
  # housing - and a vertical 163 mm pen over a sheet at base level needs
  # 4-17 deg. Commanded there the servo stalls and the tip height is fiction:
  # that was every "stuck on the first stroke" and "no ink" run. The wrist
  # servo angle is (pen elevation - forearm elevation), so each degree of tilt
  # is a degree of clearance; 15 lifts the whole box to 22-33 deg. It also
  # pulls the wrist point 28 mm toward the base, which the elbow (already
  # nearly folded here) only tolerates with the paper further out - hence
  # origin_x below. Set 0 for a vertical pen on a rig without the stop.
  pen_tilt_deg: 15

# Paper drawing area, described in the arm base frame:
#   origin = the near-left corner of the drawing box,
#   +x points away from the base, +y points to the arm's left.
#
# The drawable region is an ANNULUS, not a disc: the elbow and wrist servos
# only bend +-90 degrees from in line, so the shoulder-to-wrist distance has to
# stay between hypot(shoulder, elbow) and shoulder+elbow. With the long printed
# pen grip that band is narrow, which is why this box is small.
#
# Never hand-tune these values blind - the planner silently SKIPS moves it
# cannot solve, so an oversized box just loses strokes. Run:
#     python scripts/check_workspace.py --suggest
# after changing any link length, pen height or the rig. Raising the arm on a
# ~60 mm riser (or lowering the paper by the same amount) roughly doubles the
# drawable box, because it brings the wrist point back down relative to the
# paper. See docs/calibration.md.
paper:
  # 220 and 30 x 30, not 159 and 40 x 40: with the base and the sheet on the
  # same level, pen_tilt_deg 15 and the wrist stop in servo_limits, there is NO
  # 40 mm box the arm can draw without a joint on a limit (scripts/
  # check_workspace.py --suggest). 30 x 30 starting 220 mm out keeps 3.6 deg of
  # clearance on every joint at both pen heights. Raising the base ~50 mm on a
  # block (base_height_mm += 50) brings a full 40 x 40 box back at x=215.
  origin_x_mm: 220
  origin_y_mm: -15
  width_mm: 30             # drawing box size along +x
  height_mm: 30            # drawing box size along +y

pen:
  down_z_mm: -1.5          # pencil tip height while drawing. MEASURED with the
                           # ESP-EYE watching the pencil: the tip stops and the
                           # grip starts to pivot (= real contact) at z ~ 0; the
                           # servos only follow small height commands in jerks,
                           # so this sits 1.5 mm past contact to keep graphite
                           # on the sheet. -3 made the tilted pencil skid.
  up_z_mm: 10              # travel height for pen-up moves between strokes.
                           # 11.5 mm above down_z, not 5: the servos deliver
                           # a fraction of a small height command, and at
                           # +5 the pencil never left the sheet - the first
                           # portrait was long travel lines between strokes.
                           # 10 keeps 1.5 deg of joint margin box-wide;
                           # 13 is the band's top with none.
                           # Keep BOTH within 0-5 mm: higher lifts push the
                           # far corners of the box onto a joint limit.
                           # Every extra mm of lift raises the wrist point and
                           # shrinks the drawable area (scripts/check_workspace.py
                           # shows by how much); 6-10 mm clears the paper fine.
  down_gripper: 90         # neutral finger angle; the printed grip clamps the
                           # pencil with a screw, so this doesn't hold the tool

# Servo-angle calibration. Geometric IK angles are converted to servo degrees
# with: servo = clamp(offset + sign * geometric, 0, 180).
# Tune each offset/sign to YOUR servo zero positions with --dry-run first.
servo_calibration:
  # base:     servo = offset + sign * (rotation about the vertical)
  # shoulder: servo = offset + sign * (upper-arm elevation above horizontal).
  #           A Braccio shoulder reads 90 when the upper arm points straight up,
  #           so the elevation IS the servo angle: offset 0.
  # elbow / wrist_vertical: serial joints, so the geometric term is the bend
  #           RELATIVE to the previous link; 90 = in line with it.
  base:            { offset: 90,  sign: 1 }
  shoulder:        { offset: 0,   sign: 1 }
  elbow:           { offset: 90,  sign: 1 }
  wrist_vertical:  { offset: 90,  sign: 1 }
  wrist_rotation:  { fixed: 90 }

# Where a joint stops BEFORE the servo's 0-180. The IK refuses (strict) or
# clamps (otherwise) any pose that needs a joint outside these, so the arm is
# never commanded into a stop where it stalls silently. Widen them only after
# measuring on your rig: hold every other joint, step the one joint through the
# suspect range and watch the arm (web/calibrate + a camera does this).
servo_limits:
  # Measured 2026-09-09 with the printed pen grip: identical frames for 5, 8,
  # 11 and 13 deg, first movement at 15. 17 keeps a margin over the stop.
  wrist_vertical: { min: 17 }
  # The elbow reads 1-3 deg over the old box; nobody has proven it moves there.
  elbow: { min: 3 }

motion:
  # Decimal places kept on every servo angle sent over the M protocol.
  #
  # The paper sits ~175 mm from the base axis, so ONE DEGREE of base rotation
  # sweeps the pen tip about 3 mm and a 40 mm sheet spans only ~13 degrees. At
  # whole degrees a portrait has about a dozen addressable columns and comes out
  # as rubble; at 0.1 deg (~0.3 mm) it draws cleanly. Set 0 for firmware that
  # can only accept whole degrees.
  servo_decimals: 1
  # Ramp any move that swings a joint more than ramp_above_deg, in steps of at
  # most max_step_deg. All six servos going to full torque at once browns the
  # board out and hard-resets it; the approach from the rest pose to the paper
  # is the move that does it.
  ramp_above_deg: 8.0
  # 1.5 with an 80 ms pause per step, not 5: the unfold from the rest pose
  # to the paper is the only move that has ever reset the board - once at
  # 4 deg/step, once at 2.5 (both zeroed files on the SD card on the way
  # down). Every ramp - the CLI's approach, the UI's hover, park - uses these.
  # Smaller steps, shorter current peaks, time for the rail to recover. If
  # the arm still resets the board on the approach, the fix is a separate
  # 5 V supply for the servos, not a config value.
  max_step_deg: 1.5
  ramp_dwell_s: 0.08
  settle_s: 0.15           # pause after each pen-down point
  pen_change_s: 0.4        # pause on pen up/down transitions
  # At every stroke start dip this far below down_z_mm, then come back. The
  # servos only follow small height commands in jerks (see cli._draw_on_arm),
  # so without the dip the tip starts each stroke hovering just above the
  # sheet. 1 mm: at 3 mm of overshoot the tilted pencil skids sideways.
  pen_down_overshoot_mm: 1.0
  # Per-joint servo dead band, degrees, for the CLI's compensation: each
  # target is sent overshot by this much in the direction of travel so the
  # servo stops AT the target instead of a band short of it. Measured effect
  # without it: ~0.3 mm of tip motion per commanded mm, and strokes across
  # the sheet (base rotation, 1 deg = 4 mm at 235 mm) flattened to jitter.
  # First estimates from the z descent (~2 deg of lag on elbow/wrist at full
  # stretch, halved for safety); refine per joint by stepping it under a
  # camera. 0 disables a joint; --no-deadband disables all (the simulator and
  # Gazebo have no dead band and are run that way).
  deadband_deg:
    base: 0.6
    shoulder: 0.5
    elbow: 1.0
    wrist_vertical: 1.0

planner:
  # When the next stroke starts within this distance of where the last one
  # ended, keep the pen down and draw straight through the gap instead of
  # lifting. Reduces slow pen up/down cycles. 0 = always lift between strokes.
  join_gap_mm: 0.8

# Single-camera rig: with one wrist-mounted camera, the arm aims it at the
# subject to capture, then at the paper to calibrate. Servo angles are
# [base, shoulder, elbow, wrist_vertical, wrist_rotation, gripper] in degrees,
# sent directly to the arm (no IK).
# ⚠️ These are NOMINAL starting values — TUNE them to your arm so the camera
# frames the visitor / the paper, and so the 'page' pose does not drive the arm
# into the table. Bring up with the Braccio switch as an e-stop and --slow.
# Delete this block (or a single key) to disable auto-aiming and point by hand.
camera_poses:
  person: [90, 130, 45, 30, 90, 90]   # reach up/out, camera toward the visitor
  page:   [90, 55, 95, 120, 90, 90]   # fold down, camera over the paper
